<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroids</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
    overflow: hidden;
    height: 100%;
  }
  #game {
    display: block;
    margin: 0 auto;
    background: #000;
    box-shadow: 0 0 40px rgba(0, 255, 255, 0.15);
  }
  #hud {
    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 18px;
    letter-spacing: 2px;
    pointer-events: none;
    z-index: 10;
  }
  #hud .score { color: #0ff; }
  #hud .lives { color: #f80; }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.75);
    z-index: 20;
    text-align: center;
  }
  #overlay h1 {
    font-size: 64px;
    letter-spacing: 8px;
    margin: 0 0 10px;
    color: #0ff;
    text-shadow: 0 0 20px #0ff;
  }
  #overlay p {
    font-size: 18px;
    letter-spacing: 2px;
    margin: 8px 0;
    color: #ccc;
  }
  #overlay .hint {
    color: #888;
    font-size: 14px;
    margin-top: 20px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="score">SCORE <span id="score">0</span></div>
  <div class="lives">LIVES <span id="lives">3</span></div>
</div>
<div id="overlay">
  <h1>ASTEROIDS</h1>
  <p>Arrow keys / WASD to move and rotate</p>
  <p>Space to fire</p>
  <p>Click or press Enter to start</p>
  <p class="hint">Survive the swarm</p>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay');

  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const state = {
    running: false,
    score: 0,
    lives: 3,
    ship: null,
    asteroids: [],
    bullets: [],
    powerups: [],
    particles: [],
    stars: [],
    keys: {},
    lastTime: 0,
    spawnTimer: 0,
    spawnInterval: 2.5,
    difficulty: 1,
    gameOver: false,
    paused: false
  };

  function makeStars() {
    state.stars = [];
    for (let i = 0; i < 120; i++) {
      state.stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.5,
        speed: Math.random() * 0.3 + 0.1
      });
    }
  }

  function createShip(x, y) {
    return {
      x: x !== undefined ? x : W / 2,
      y: y !== undefined ? y : H / 2,
      angle: -Math.PI / 2,
      vx: 0,
      vy: 0,
      radius: 12,
      thrust: 0.35,
      invulnerable: 0
    };
  }

  function createAsteroid(x, y, size) {
    const speed = (Math.random() * 0.5 + 0.3) * (size === 1 ? 1.5 : size === 2 ? 1.2 : 1);
    const angle = Math.random() * Math.PI * 2;
    const verts = [];
    const count = Math.floor(Math.random() * 3) + 6;
    const radius = size === 1 ? 12 : size === 2 ? 22 : 38;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      const r = radius * (0.7 + Math.random() * 0.5);
      verts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
    }
    return {
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius,
      size,
      health: size === 1 ? 1 : size === 2 ? 2 : 3,
      verts,
      spin: (Math.random() * 0.02 + 0.005) * (Math.random() < 0.5 ? 1 : -1),
      spinAngle: Math.random() * Math.PI * 2
    };
  }

  function spawnAsteroids(n) {
    for (let i = 0; i < n; i++) {
      const size = Math.random() < 0.3 ? 1 : Math.random() < 0.6 ? 2 : 3;
      let x = Math.random() * W;
      let y = Math.random() * H;
      const ship = state.ship;
      if (ship && Math.hypot(x - ship.x, y - ship.y) < 150) {
        x = W - x;
        y = H - y;
      }
      state.asteroids.push(createAsteroid(x, y, size));
    }
    // Cap total asteroids to prevent performance issues
    if (state.asteroids.length > 40) {
      while (state.asteroids.length > 40) {
        const idx = Math.floor(Math.random() * state.asteroids.length);
        const a = state.asteroids[idx];
        explode(a.x, a.y, '#ff0', 10);
        state.asteroids.splice(idx, 1);
      }
    }
  }

  function fireBullet() {
    const ship = state.ship;
    if (!ship || state.bullets.length >= 5) return;
    const angle = ship.angle;
    state.bullets.push({
      x: ship.x + Math.cos(angle) * 14,
      y: ship.y + Math.sin(angle) * 14,
      vx: Math.cos(angle) * 8,
      vy: Math.sin(angle) * 8,
      life: 60,
      radius: 3
    });
  }

  function spawnPowerup(x, y) {
    const types = ['speed', 'shield', 'lives'];
    const type = types[Math.floor(Math.random() * types.length)];
    state.powerups.push({
      x, y,
      type,
      radius: 8,
      pulse: 0
    });
  }

  function explode(x, y, color, count) {
    count = count || 15;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3 + 1;
      state.particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 40 + Math.random() * 20,
        maxLife: 40 + Math.random() * 20,
        color
      });
    }
    // Cap particles
    if (state.particles.length > 500) {
      while (state.particles.length > 500) {
        state.particles.shift();
      }
    }
  }

  function circleDist(x1, y1, x2, y2, r1, r2) {
    return Math.hypot(x1 - x2, y1 - y2) < r1 + r2;
  }

  function wrap(obj) {
    const r = obj.radius || 3;
    if (obj.x < -r) obj.x += W + r * 2;
    if (obj.x > W + r) obj.x -= W + r * 2;
    if (obj.y < -r) obj.y += H + r * 2;
    if (obj.y > H + r) obj.y -= H + r * 2;
  }

  function startGame() {
    state.score = 0;
    state.lives = 3;
    state.asteroids = [];
    state.bullets = [];
    state.powerups = [];
    state.particles = [];
    state.ship = createShip();
    state.difficulty = 1;
    state.spawnTimer = 0;
    state.spawnInterval = 2.5;
    state.gameOver = false;
    state.running = true;
    state.paused = false;
    overlay.classList.add('hidden');
    spawnAsteroids(5);
    updateHUD();
  }

  function updateHUD() {
    scoreEl.textContent = state.score;
    livesEl.textContent = state.lives;
  }

  function loseLife() {
    state.lives--;
    updateHUD();
    if (state.lives <= 0) {
      state.gameOver = true;
      state.running = false;
      overlay.classList.remove('hidden');
      overlay.querySelector('h1').textContent = 'GAME OVER';
      overlay.querySelector('p:nth-child(2)').textContent = 'Final score: ' + state.score;
      overlay.querySelector('p:nth-child(3)').textContent = 'Press Enter or click to restart';
    } else {
      state.ship = createShip();
      state.ship.invulnerable = 2;
      state.asteroids = state.asteroids.filter(a => Math.hypot(a.x - state.ship.x, a.y - state.ship.y) > 200);
    }
  }

  window.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();
    state.keys[key] = true;
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (!state.running && !state.gameOver) {
        startGame();
      } else if (state.gameOver) {
        startGame();
      } else if (state.paused) {
        state.paused = false;
      }
    }
    if (key === 'p') {
      if (state.running) state.paused = !state.paused;
    }
    if (key === 'shift') {
      if (state.running && state.ship) {
        state.ship.x = Math.random() * W;
        state.ship.y = Math.random() * H;
        state.ship.vx = 0;
        state.ship.vy = 0;
      }
    }
  });
  window.addEventListener('keyup', e => {
    state.keys[e.key.toLowerCase()] = false;
  });
  window.addEventListener('click', () => {
    if (!state.running && !state.gameOver) {
      startGame();
    } else if (state.gameOver) {
      startGame();
    }
  });

  function update(dt) {
    const ship = state.ship;
    if (!ship) return;

    const keys = state.keys;
    const turnSpeed = 0.125 * dt * 60;

    if (keys['arrowleft'] || keys['a']) ship.angle -= turnSpeed;
    if (keys['arrowright'] || keys['d']) ship.angle += turnSpeed;
    if (keys['arrowup'] || keys['w']) {
      ship.vx += Math.cos(ship.angle) * ship.thrust * dt * 60;
      ship.vy += Math.sin(ship.angle) * ship.thrust * dt * 60;
    }
    if (keys['arrowdown'] || keys['s']) {
      ship.vx -= Math.cos(ship.angle) * ship.thrust * dt * 60;
      ship.vy -= Math.sin(ship.angle) * ship.thrust * dt * 60;
    }

    const friction = Math.pow(0.99, dt * 60);
    ship.vx *= friction;
    ship.vy *= friction;
    ship.x += ship.vx * dt * 60;
    ship.y += ship.vy * dt * 60;
    wrap(ship);

    if (ship.invulnerable > 0) ship.invulnerable -= dt;

    if (keys[' '] && state.bullets.length < 5) {
      fireBullet();
      keys[' '] = false;
    }

    // Bullets
    for (let i = state.bullets.length - 1; i >= 0; i--) {
      const b = state.bullets[i];
      b.x += b.vx * dt * 60;
      b.y += b.vy * dt * 60;
      b.life--;
      wrap(b);
      if (b.life <= 0) {
        state.bullets.splice(i, 1);
        continue;
      }
      for (let j = state.asteroids.length - 1; j >= 0; j--) {
        const a = state.asteroids[j];
        if (circleDist(b.x, b.y, a.x, a.y, b.radius, a.radius)) {
          a.health--;
          state.bullets.splice(i, 1);
          if (a.health <= 0) {
            state.score += a.size * 100;
            updateHUD();
            explode(a.x, a.y, '#ff0', 20);
            if (Math.random() < 0.15) spawnPowerup(a.x, a.y);
            state.asteroids.splice(j, 1);
          }
          break;
        }
      }
    }

    // Asteroids
    for (let i = state.asteroids.length - 1; i >= 0; i--) {
      const a = state.asteroids[i];
      a.x += a.vx * dt * 60;
      a.y += a.vy * dt * 60;
      a.spinAngle += a.spin * dt * 60;
      wrap(a);
      if (ship.invulnerable <= 0 && circleDist(a.x, a.y, ship.x, ship.y, a.radius, ship.radius)) {
        explode(ship.x, ship.y, '#f80', 25);
        loseLife();
        break;
      }
    }

    // Asteroid-asteroid collisions
    for (let i = 0; i < state.asteroids.length; i++) {
      const a1 = state.asteroids[i];
      for (let j = i + 1; j < state.asteroids.length; j++) {
        const a2 = state.asteroids[j];
        if (circleDist(a1.x, a1.y, a2.x, a2.y, a1.radius, a2.radius)) {
          // Calculate collision normal
          const dx = a2.x - a1.x;
          const dy = a2.y - a1.y;
          const dist = Math.hypot(dx, dy) || 1;
          const nx = dx / dist;
          const ny = dy / dist;

          // Relative velocity along normal
          const dvx = a1.vx - a2.vx;
          const dvy = a1.vy - a2.vy;
          const dot = dvx * nx + dvy * ny;

          // Only bounce if approaching
          if (dot > 0) {
            const mass1 = a1.size;
            const mass2 = a2.size;
            const invMass1 = 1 / mass1;
            const invMass2 = 1 / mass2;

            const j = dot / (invMass1 + invMass2);

            a1.vx -= j * invMass1 * nx;
            a1.vy -= j * invMass1 * ny;
            a2.vx += j * invMass2 * nx;
            a2.vy += j * invMass2 * ny;

            // Separate overlapping asteroids
            const overlap = a1.radius + a2.radius - dist;
            if (overlap > 0) {
              const sepX = nx * overlap / 2;
              const sepY = ny * overlap / 2;
              a1.x -= sepX;
              a1.y -= sepY;
              a2.x += sepX;
              a2.y += sepY;
            }
          }
        }
      }
    }

    // Powerups
    for (let i = state.powerups.length - 1; i >= 0; i--) {
      const p = state.powerups[i];
      p.pulse += dt * 3;
      wrap(p);
      if (circleDist(p.x, p.y, ship.x, ship.y, p.radius + 15)) {
        if (p.type === 'speed') {
          ship.thrust = Math.min(ship.thrust * 1.5, 0.8);
        } else if (p.type === 'shield') {
          ship.invulnerable = 3;
        } else if (p.type === 'lives') {
          state.lives++;
          updateHUD();
        }
        state.powerups.splice(i, 1);
      }
    }

    // Particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      p.vx *= 0.98;
      p.vy *= 0.98;
      p.life--;
      if (p.life <= 0) state.particles.splice(i, 1);
    }

    // Spawn asteroids
    state.spawnTimer += dt;
    if (state.spawnTimer >= state.spawnInterval) {
      state.spawnTimer = 0;
      const count = Math.min(3 + Math.floor(state.difficulty * 0.5), 5);
      spawnAsteroids(count);
      state.difficulty += 0.1;
      state.spawnInterval = Math.max(1.0, 2.5 - state.difficulty * 0.3);
    }

    // Stars drift
    for (const s of state.stars) {
      s.y += s.speed * dt * 60;
      if (s.y > H) s.y = -10;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = '#fff';
    for (const s of state.stars) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const p of state.powerups) {
      const pulse = Math.sin(p.pulse) * 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius + pulse, 0, Math.PI * 2);
      ctx.fillStyle = p.type === 'speed' ? '#0f0' : p.type === 'shield' ? '#0ff' : '#f80';
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(p.type === 'speed' ? 'S' : p.type === 'shield' ? '!' : '+', p.x, p.y + 4);
    }

    for (const a of state.asteroids) {
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.spinAngle);
      ctx.beginPath();
      ctx.moveTo(a.verts[0].x, a.verts[0].y);
      for (let i = 1; i < a.verts.length; i++) {
        ctx.lineTo(a.verts[i].x, a.verts[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = '#888';
      ctx.fill();
      ctx.strokeStyle = '#aaa';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    ctx.fillStyle = '#0ff';
    for (const b of state.bullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const p of state.particles) {
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const ship = state.ship;
    if (ship) {
      ctx.save();
      ctx.translate(ship.x, ship.y);
      ctx.rotate(ship.angle + Math.PI / 2);
      if (ship.invulnerable > 0 && Math.floor(ship.invulnerable * 10) % 2 === 0) {
        ctx.globalAlpha = 0.3;
      }
      ctx.beginPath();
      ctx.moveTo(0, -14);
      ctx.lineTo(-10, 10);
      ctx.lineTo(-4, 4);
      ctx.lineTo(4, 4);
      ctx.lineTo(10, 10);
      ctx.closePath();
      ctx.fillStyle = '#0ff';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    if (state.paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = '32px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', W / 2, H / 2);
    }
  }

  function loop(timestamp) {
    if (!state.lastTime) state.lastTime = timestamp;
    const dt = Math.min((timestamp - state.lastTime) / 1000, 0.05);
    state.lastTime = timestamp;

    if (state.running && !state.paused) {
      update(dt);
    }
    draw();
    requestAnimationFrame(loop);
  }

  makeStars();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
